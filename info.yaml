project:
  title:        "Protocol Emulator ASIC"
  author:       "Poorvi"
  discord:      ""
  description:  "A programmable ASIC protocol emulator supporting configurable digital communication protocols."
  language:     "Verilog"
  clock_hz:     0

  tiles: "6x4"

  top_module:  "tt_um_protocol_emulator"

  source_files:
    - "project.v"
    - "protocol_core.v"
    - "serial_loader.v"

pinout:
  # Inputs
  ui[0]: "SERIAL_IN / GPIO_IN[0]"
  ui[1]: "SERIAL_VALID"
  ui[2]: "PROGRAM_MODE"
  ui[3]: "GPIO_IN[3]"
  ui[4]: "GPIO_IN[4]"
  ui[5]: "GPIO_IN[5]"
  ui[6]: "GPIO_IN[6]"
  ui[7]: "GPIO_IN[7]"

  # Outputs
  uo[0]: "GPIO_OUT[0]"
  uo[1]: "GPIO_OUT[1]"
  uo[2]: "GPIO_OUT[2]"
  uo[3]: "GPIO_OUT[3]"
  uo[4]: "GPIO_OUT[4]"
  uo[5]: "GPIO_OUT[5]"
  uo[6]: "GPIO_OUT[6]"
  uo[7]: "GPIO_OUT[7]"

  # Bidirectional pins
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

yaml_version: 6
